name: Build and Publish Release
permissions:
  contents: write
  packages: write

on:
  push:
    tags: ["*"]

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: dorcs-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: dorcs-linux-arm64
          - goos: windows
            goarch: amd64
            binary_name: dorcs-windows-amd64.exe
          - goos: windows
            goarch: arm64
            binary_name: dorcs-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            binary_name: dorcs-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary_name: dorcs-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Get Tags
        id: get_tag
        run: |
          cur=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=0 --max-count=1))
          echo "VERSION=$cur" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X dorcs-v2/cmd/dorcs.Version=${{ steps.get_tag.outputs.VERSION }}" \
            -o ${{ matrix.binary_name }} \
            ./cmd/dorcs

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 7

  build-docker:
    runs-on: ubuntu-latest
    needs: build-binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Tags
        id: get_tag
        run: |
          cur=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=0 --max-count=1))
          echo "VERSION=$cur" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images (Docker Hub + GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.get_tag.outputs.VERSION }}
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dorcs:${{ steps.get_tag.outputs.VERSION }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dorcs:latest
            ghcr.io/${{ github.repository_owner }}/dorcs:${{ steps.get_tag.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/dorcs:latest
          cache-from: |
            type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dorcs:latest
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/dorcs:latest
          cache-to: type=inline

  create-release:
    runs-on: ubuntu-latest
    needs: [build-binaries, build-docker]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Tags
        id: get_tag
        run: |
          cur=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=0 --max-count=1))
          echo "VERSION=$cur" >> $GITHUB_OUTPUT

      - name: Install git-chglog
        run: |
          curl -sSL https://github.com/git-chglog/git-chglog/releases/download/v0.15.4/git-chglog_0.15.4_linux_amd64.tar.gz \
            | tar -xz
          sudo mv git-chglog /usr/local/bin/

      - name: Generate changelog
        run: |
          CUR=${{ steps.get_tag.outputs.VERSION }}
          
          echo "## 🚀 Release $CUR" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md           
          
          git-chglog $CUR >> RELEASE_NOTES.md

          echo "🔖 Generated notes:"
          cat RELEASE_NOTES.md

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries
          pattern: 'dorcs-*'
        continue-on-error: true

      - name: Flatten artifact structure
        run: |
          cd binaries
          find . -mindepth 2 -type f -exec mv {} . \; 2>/dev/null || true
          find . -mindepth 1 -type d -empty -delete 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            binaries/dorcs-*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

