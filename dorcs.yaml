# dorcs Configuration File
# Place this file in your project root (current working directory) or docs directory
# The config file is looked for in the current directory first, then in the docs directory
# You can also specify a custom path with --config flag

# Server port (default: 8080)
# Optional: specify the port on which dorcs should run
port: 8080

# Site metadata
site:
  # Title shown in the header/brand area (top-left)
  title: "Dorcs"

  # Description for meta tags (optional)
  description: "Single static binary documentation server for Markdown files"

  # Logo URL - replaces text title if set (optional)
  # Place logo.png in the docs directory (or a shared asset location under docs/) and reference it as "/logo.png"
  # logo: "/logo.png"

  # Custom favicon URL (optional)
  # Place favicon.ico in the docs directory (or a shared asset location under docs/) and reference it as "/favicon.ico"
  # favicon: "/favicon.ico"

# Theme and styling configuration
theme:
  # Mode: "light", "dark", or "auto" (follows system preference)
  mode: auto

  # Preset theme: default, ocean, forest, sunset, midnight, lavender, rose
  preset: default 

  # Custom colors (override preset colors)
  # colors:
  #   light:
  #     background: "#ffffff"
  #     foreground: "#1f2328"
  #     muted: "#57606a"
  #     border: "#d0d7de"
  #     accent: "#0969da"
  #     code_background: "#f6f8fa"
  #     header_background: "#ffffff"
  #     sidebar_background: "#fafbfc"
  #   dark:
  #     background: "#0d1117"
  #     foreground: "#e6edf3"
  #     muted: "#8b949e"
  #     border: "#30363d"
  #     accent: "#2f81f7"
  #     code_background: "#161b22"

  # Note: Code syntax highlighting theme is now automatically determined by the preset theme
  # The code_theme option is deprecated and ignored 

  # Path to custom CSS file (relative to docs directory)
  # custom_css: "custom.css"

  # Custom font family for body text (CSS font-family value)
  # font_family: '"Inter", system-ui, sans-serif'

  # Custom font family for code (CSS font-family value)
  # mono_font_family: '"JetBrains Mono", monospace'

# Navigation configuration
nav:
  # Search trigger configuration key (currently accepted, but the UI always shows search)
  show_search: true

  # Expand-all configuration key (currently accepted, but not used by the UI)
  expand_all: false

  # Section tabs with grouped navigation (renders a second header row with tabs).
  sections:
    - title: "Getting Started"
      items:
        - Overview: index.md
        - Getting Started: 01_getting-started.md
        - Installation: 02_installation.md

    - title: "Writing Docs"
      items:
        - Overview: usage/index.md
        - Organizing Pages: usage/organizing-pages.md
        - Front Matter: usage/front-matter.md
        - Markdown Basics: usage/markdown-basics.md
        - Callouts: usage/callouts.md
        - Extensions: usage/extensions.md

    - title: "Customize"
      items:
        - Customize Your Site:
            page: config/index.md
            items:
              - Branding: config/branding.md
              - Navigation: config/navigation.md
              - Languages & Versions: config/languages-versions.md
        - Themes: 05_themes.md
        - External Content:
            page: external-content/index.md
            items:
              - GitHub Integration: external-content/github.md
        - Edit Mode: 08_edit.md
        - Config Reference: 03_configuration.md

    - title: "Presentations"
      items:
        - Presentations:
            page: 07_presentations/index.md
            items:
              - Slide Directives: 07_presentations/01_directives.md
              - Layout: 07_presentations/02_layout.md
              - Typography: 07_presentations/03_typography.md
              - Timeline Block: 07_presentations/04_timeline_block.md
              - Presentation Code Example: 07_presentations/05_sample_presentation_code.md
              - Example Presentation: 07_presentations/06_example_presentation.md

    - title: "Reference"
      items:
        - Commands: 07_commands.md
        - Deployment: 04_deployment.md

  # Additional navigation links shown in the header
  links:
    - title: "GitHub"
      url: "https://github.com/p-arndt/dorcs"
      external: true
      icon: "github"  # Options: github, twitter, discord, external
  #
  #   - title: "Discord"
  #     url: "https://discord.gg/yourserver"
  #     external: true
  #     icon: "discord"

# Footer configuration
footer:
  # Copyright text
  # copyright: "© 2024 Your Name"

  # Custom footer text
  text: "Built with ❤️"

  # Show "Powered by dorcs" (default: true)
  show_powered_by: true

  # Footer links
  # links:
  #   - title: "Privacy Policy"
  #     url: "/privacy"
  #   - title: "Terms"
  #     url: "/terms"

# Multi-lingual support configuration
# languages:
#   # Default language code (served at root URL, no prefix)
#   default: "en"
#
#   # Enabled languages list (explicit configuration required)
#   enabled:
#     - code: "en"
#       name: "English"
#     - code: "de"
#       name: "Deutsch"
#   # Add more languages as needed:
#   #   - code: "fr"
#   #     name: "Français"
#   #   - code: "es"
#   #     name: "Español"

# Versioning configuration
# Allows you to maintain multiple versions of your documentation (e.g., v1, v2, latest)
# Default-version content is served from the root docs folder.
# Non-default versions are served from direct folders like docs/v1/ and docs/v2/.
# versions:
#   # Default version identifier (served at root URL, no prefix)
#   default: "latest"

#   # Enabled versions list (explicit configuration required)
#   enabled:
#     - id: "v1"
#       name: "V1"

# File structure examples with MkDocs-style structure:
#
# Versioning only (no languages):
# docs/
#   index.md                    # Default version - served at /
#   getting-started.md
#   v0/
#     index.md                  # Version 0 - served at /v0/
#     getting-started.md
#   v1/
#     index.md                  # Version 1 - served at /v1/
#     getting-started.md
#
# Both versioning and languages (language-first):
# docs/
#   index.md                    # en, default version - served at /
#   en/
#     index.md                  # en, default version - served at /en/
#     v0/
#       index.md                # en, v0 - served at /en/v0/
#     v1/
#       index.md                # en, v1 - served at /en/v1/
#   de/
#     index.md                  # de, default version - served at /de/
#     v0/
#       index.md                # de, v0 - served at /de/v0/
#     v1/
#       index.md                # de, v1 - served at /de/v1/
#
# URL examples:
# - Default version: /getting-started → docs/getting-started.md (or docs/en/getting-started.md)
# - Versioned: /v1/getting-started → docs/v1/getting-started.md
# - With language: /en/v1/getting-started → docs/en/v1/getting-started.md

# Authentication and Edit Mode configuration
auth:
  # Enable authentication and edit mode
  enabled: true

  # Username for login
  username: "admin"

  # Password (will be hashed automatically on first use)
  # After first use, the password_hash will be saved to the config file
  password: "admin"
#
#   # Sessions file path (default: .dorcs_sessions.json in docs directory)
#   # sessions_path: ".dorcs_sessions.json"

# GitHub integration configuration
github:
  # Enable GitHub integration to fetch and serve markdown files from a GitHub repository
  enabled: false

  # Repository tree URL (e.g., "https://github.com/p-arndt/dorcs/tree/main/docs")
  # Supports formats:
  # - https://github.com/owner/repo/tree/branch/path
  # - https://github.com/owner/repo (uses default branch, root directory)
  repository: "https://github.com/p-arndt/dorcs/tree/main/docs"

  # GitHub token for private repositories (optional, supports ${ENV_VAR} expansion)
  token: ${GITHUB_TOKEN}

  # edit_on_github:                                 # Optional: "Edit on GitHub" for local docs
    # repository: "https://github.com/owner/repo/tree/main/docs"
  # Cache time-to-live for GitHub content (optional, default: 1h)
  # Examples: "1h", "30m", "24h"
  # cache_ttl: "1h"
