{{/* Table of Contents partials */}}
{{ define "mobile_toc" }}
{{- if .TOC }}
<!-- Mobile TOC -->
<div class="mobile-toc" id="mobile-toc">
  <button class="mobile-toc-toggle" id="mobile-toc-toggle">
    <span>On this page</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
  <div class="mobile-toc-body">
    {{ .TOC }}
  </div>
</div>
{{- end }}
{{ end }}

{{ define "desktop_toc" }}
<aside class="toc">
  <div class="toc-card">
    <div class="toc-header">On this page</div>
    <div class="toc-body" id="toc">
      {{- if .TOC }}
        {{ .TOC }}
      {{- else }}
        <div class="muted">No headings.</div>
      {{- end }}
    </div>
  </div>
</aside>
{{ end }}
